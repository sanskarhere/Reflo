# Config-driven guardrails — data, not eval()'d expressions. Section 3.4 of the
# design doc. Order matters: the first active rule that fires wins, so
# non-negotiable rules (mandate_revoked) are listed first.
rules:
  - name: mandate_revoked
    type: mandate_status_eq
    value: revoked
    forced_action: stop
    active: true

  - name: high_value
    type: amount_paise_gt
    threshold: 5000000        # ₹50,000
    forced_action: escalate_human
    active: true

  - name: max_attempts
    type: attempt_count_gte
    threshold: 3
    forced_action: stop
    active: true

  - name: repeat_unknown_cause
    type: unknown_classification_count_gte
    threshold: 2
    forced_action: escalate_human
    active: true

  - name: cooldown
    type: hours_since_last_attempt_lt
    threshold: 12
    forced_action: retry_scheduled
    active: true
