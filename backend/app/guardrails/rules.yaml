# Config-driven guardrails — data, not prompt text. Section 3.4 of the design doc.
rules:
  - name: max_attempts
    condition: "attempt_count >= 3"
    forced_action: stop
    active: true
  - name: cooldown
    condition: "hours_since_last_attempt < 12"
    forced_action: retry_scheduled
    active: true
  - name: mandate_revoked
    condition: "mandate_status == 'revoked'"
    forced_action: stop
    active: true
  - name: high_value
    condition: "amount_paise > 5000000"
    forced_action: escalate_human
    active: true
  - name: repeat_unknown_cause
    condition: "unknown_classification_count >= 2"
    forced_action: escalate_human
    active: true
