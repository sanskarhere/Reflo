databases:
  - name: reflo-db
    plan: free
    databaseName: reflo
    user: reflo

services:
  - type: web
    name: reflo-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        value: "*"  # update to the real Vercel URL once the frontend is deployed
      - key: DATABASE_URL
        fromDatabase:
          name: reflo-db
          property: connectionString
